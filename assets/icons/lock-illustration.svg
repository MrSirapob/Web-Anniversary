  <circle cx="100" cy="100" r="96" fill="#F3E7E9"/>
  <circle cx="100" cy="100" r="70" fill="#EFDCE1"/>

  <!-- lock shackle -->
  <path d="M74 92 V70 a26 26 0 0 1 52 0 v22" fill="none" stroke="#C3B6DE" stroke-width="10" stroke-linecap="round"/>

